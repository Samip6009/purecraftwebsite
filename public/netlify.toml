# Netlify configuration for Pure Craft
# Brotli compression is enabled by default on Netlify

[build]
  publish = "dist"
  command = "npm run build"

# Enable Brotli compression
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.images]
  compress = true

# Redirects for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache headers are in _headers file
