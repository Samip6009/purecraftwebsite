<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>Pure Craft — Digital Marketing Agency in Nepal</title>
    <meta name="description" content="Pure Craft is Nepal's leading digital marketing agency. AI-powered marketing, appointment setting, and lead generation for growing businesses." />
    <meta name="keywords" content="Pure Craft, Marketing Agency Nepal, Digital Marketing Nepal, SMMA Nepal, AI Appointment Setting" />
    <meta name="author" content="Pure Craft" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Pure Craft — Digital Marketing Agency in Nepal" />
    <meta property="og:description" content="AI-powered marketing and lead generation for growing businesses in Nepal." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://samipkc.com.np" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pure Craft — Digital Marketing Agency in Nepal" />
    <meta name="twitter:description" content="AI-powered marketing and lead generation for growing businesses in Nepal." />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://samipkc.com.np" />
    
    <!-- Preconnect to Google Fonts for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Preload critical fonts with font-display: swap -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" />
    </noscript>
    
    <!-- DNS Prefetch for external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#0A0A0A" />
    
    <!-- Critical CSS inline -->
    <style>
      /* Critical above-the-fold styles */
      *,*::before,*::after{box-sizing:border-box}
      html{font-size:16px;-webkit-font-smoothing:antialiased}
      body{margin:0;background:#fff;color:#0a0a0a;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
      #root{min-height:100vh}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
      .skeleton-pulse{animation:pulse 2s cubic-bezier(0.4,0,0.6,1) infinite}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
