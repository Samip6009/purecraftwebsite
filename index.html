    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#0A0A0A" />
    
    <!-- Critical CSS inline -->
